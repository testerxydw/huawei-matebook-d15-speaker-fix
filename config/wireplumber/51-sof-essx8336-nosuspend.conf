## 华为 MateBook D15 (BoF-XX) / ES8336 —— 禁止 PipeWire 空闲挂起
##
## 来源（固化于本项目）：config/wireplumber/51-sof-essx8336-nosuspend.conf
## 目的：避免 ES8336(pcm0，扬声器+耳机共用) 在空闲后被 WirePlumber 挂起(关闭 PCM)，
##       减少"空闲/唤醒→PCM 反复重配"导致的偶发失声。见 doc/AUDIO_SILENCE_ANALYSIS.zh-CN.md
##
## 部署位置（由 install.sh 的 apply_wireplumber_nosuspend() 自动安装）：
##   ~/.config/wireplumber/wireplumber.conf.d/51-sof-essx8336-nosuspend.conf
##
## 【恢复 / 回滚方式】
##   1) 删除部署位置的文件：
##        rm -f ~/.config/wireplumber/wireplumber.conf.d/51-sof-essx8336-nosuspend.conf
##   2) 重启 WirePlumber：
##        systemctl --user restart wireplumber
##   3) 校验（应不再出现该属性为 0）：
##        wpctl status | grep -i Headphones     # 取 sink 编号
##        wpctl inspect <编号> | grep -i suspend
##
## 【生效校验】该 sink 的 session.suspend-timeout-seconds 应为 "0"：
##   sid=$(wpctl status | sed -n 's/^[^0-9]*\([0-9]\+\)\..*Headphones.*/\1/p' | head -1)
##   wpctl inspect "$sid" | grep -i suspend

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_.*sof-essx8336.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
